name: CI (fork / self-hosted)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
    paths-ignore:
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two clusters back this workflow:
#   - capybara (172.16.0.25)  → x86 runner-set "arc-runner-set-frigate"
#   - GH200    (172.16.0.20)  → arm64 runner-set "arc-runner-set-frigate-arm64"
# Each has its own apt-cacher-ng exposed on hostPort 3142. Per-job APT_PROXY env
# selects the right one. The Dockerfile patch step reads $APT_PROXY at runtime.

jobs:
  amd64_build:
    runs-on: arc-runner-set-frigate
    name: AMD64 Build
    env:
      APT_PROXY: http://172.16.0.25:3142
    steps:
      - name: Install build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make ca-certificates
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inject apt-cacher-ng proxy into Dockerfiles
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, glob
          proxy = os.environ.get('APT_PROXY', 'http://172.16.0.25:3142')
          patch_lines = [
              'RUN if [ -d /etc/apt/apt.conf.d ]; then '
              f'echo "Acquire::http::Proxy \\"{proxy}\\";" > /etc/apt/apt.conf.d/00proxy; '
              'echo "Acquire::https::Proxy \\"DIRECT\\";" >> /etc/apt/apt.conf.d/00proxy; '
              'echo "Acquire::http::Pipeline-Depth 0;" > /etc/apt/apt.conf.d/99no-pipeline; '
              'echo "Acquire::Retries 10;" > /etc/apt/apt.conf.d/99retries; '
              'fi; '
              'for s in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do '
              '  [ -f "$s" ] && sed -i -E "s|http://(deb\\.debian\\.org/debian-security)|https://\\1|g; s|http://(security\\.debian\\.org)|https://\\1|g" "$s" || true; '
              'done; true',
          ]
          for f in glob.glob('docker/**/Dockerfile*', recursive=True):
              if not os.path.isfile(f):
                  continue
              with open(f) as h:
                  lines = h.read().splitlines()
              out = []
              for line in lines:
                  out.append(line)
                  if re.match(r'^FROM ', line) and not re.match(r'^FROM\s+scratch(\s|$)', line):
                      out.extend(patch_lines)
              with open(f, 'w') as h:
                  h.write('\n'.join(out) + '\n')
              print('patched', f)
          PY
      - id: setup
        uses: ./.github/actions/setup-fork
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 standard build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/main/Dockerfile
          push: true
          platforms: linux/amd64
          target: frigate
          tags: ${{ steps.setup.outputs.image-name }}-amd64
          cache-from: type=registry,ref=${{ steps.setup.outputs.cache-name }}-amd64
          cache-to: type=registry,ref=${{ steps.setup.outputs.cache-name }}-amd64,mode=max

  arm64_build:

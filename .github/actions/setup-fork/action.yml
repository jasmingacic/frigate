name: 'Setup (fork)'
description: 'Setup for fork-only self-hosted runners (DinD, no sudo dance)'
inputs:
  GITHUB_TOKEN:
    required: true
outputs:
  image-name:
    value: ghcr.io/${{ steps.lowercaseRepo.outputs.lowercase }}:${{ steps.create-short-sha.outputs.SHORT_SHA }}
  cache-name:
    value: ghcr.io/${{ steps.lowercaseRepo.outputs.lowercase }}:cache
runs:
  using: "composite"
  steps:
    - id: lowercaseRepo
      uses: ASzc/change-string-case-action@v6
      with:
        string: ${{ github.repository }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to the Container registry
      uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.GITHUB_TOKEN }}
    - name: Create version file
      run: make version
      shell: bash
    - id: create-short-sha
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      shell: bash
